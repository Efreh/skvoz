[package]
name = "skvoz-android-native"
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "skvoz_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.22.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "time", "net"] }
skvoz-network = { path = "../../../network", features = ["portable-runtime"] }
skvoz-network-native = { path = "../../../network/native" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
