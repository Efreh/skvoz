name: Server connector
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler: '4.0.22'
          bundler-cache: true
          working-directory: connectors/server
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
      - name: Core, daemon and real NATS regression
        run: python3 testbench/run.py check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Ruby contracts and real server, TLS, ACME tests in Docker
        run: |
          docker build --target tests -f connectors/server/Dockerfile -t skvoz-server:tests .
          docker run --rm skvoz-server:tests
      - name: Build qualified image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: connectors/server/Dockerfile
          target: deploy
          platforms: linux/amd64
          load: true
          tags: skvoz-server:qualification
      - name: Compose tests with an independent Core client
        run: |
          test_bin="$RUNNER_TEMP/skvoz-test-bin"
          mkdir -p "$test_bin"
          container=$(docker create skvoz-server:qualification)
          trap 'docker rm -v "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/skvoz-core-daemon" "$test_bin/skvoz-core-daemon"
          cd connectors/server
          SKVOZ_COMPOSE=1 SKVOZ_TEST_IMAGE=skvoz-server:qualification \
            SKVOZ_TEST_CORE="$test_bin/skvoz-core-daemon" bundle exec rspec spec/compose_spec.rb
  publish:
    needs: qualify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/skvoz-server" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Publish verified source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: connectors/server/Dockerfile
          target: deploy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
