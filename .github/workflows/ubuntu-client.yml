name: Ubuntu client
on:
  push:
    branches: [main, master]
    tags: ['ubuntu-v*']
    paths:
      - 'clients/ubuntu/**'
      - 'core/**'
      - 'network/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'connectors/server/lib/**'
      - 'connectors/server/bin/**'
      - 'connectors/server/Gemfile'
      - 'connectors/server/Gemfile.lock'
      - 'connectors/server/spec/support/**'
      - 'connectors/server/spec/spec_helper.rb'
      - '.github/workflows/ubuntu-client.yml'
  pull_request:
    paths:
      - 'clients/ubuntu/**'
      - 'core/**'
      - 'network/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'connectors/server/lib/**'
      - 'connectors/server/bin/**'
      - 'connectors/server/Gemfile'
      - 'connectors/server/Gemfile.lock'
      - 'connectors/server/spec/support/**'
      - 'connectors/server/spec/spec_helper.rb'
      - '.github/workflows/ubuntu-client.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ubuntu-client-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native UI build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 systemd-resolved polkitd libgtk-4-dev libadwaita-1-dev pkg-config xvfb xauth dbus-x11 x11-apps adwaita-icon-theme librsvg2-common curl openssl jq
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0.7'
          bundler: '4.0.22'
          bundler-cache: true
          working-directory: connectors/server
      - name: Native Rust contracts and shared network runtime
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p skvoz-ubuntu-client --all-targets --features qualification,skvoz-network/linux-runtime -- -D warnings
          cargo build --release --locked -p skvoz-ubuntu-client --features qualification,skvoz-network/linux-runtime -p skvoz-network -p skvoz-network-helper
          cargo test --release --locked -p skvoz-ubuntu-client --lib
          SKVOZ_UI_TEST=1 dbus-run-session -- xvfb-run -a cargo test --release --locked -p skvoz-ubuntu-client --test ui -- --nocapture
      - name: Pinned real NATS for independent client process tests
        run: |
          image=nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm -v "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/skvoz-bin"
          docker cp "$container:/usr/local/bin/nats-server" "$RUNNER_TEMP/skvoz-bin/nats-server"
      - name: Real HTTP, TLS CONNECT, SOCKS and recovery
        env:
          SKVOZ_INTEGRATION: '1'
        run: |
          export SKVOZ_TEST_RUNTIME="$GITHUB_WORKSPACE/target/release/skvoz-network-runtime"
          export SKVOZ_TEST_CLIENT="$GITHUB_WORKSPACE/target/release/skvoz-client-test-driver"
          export SKVOZ_TEST_NATS="$RUNNER_TEMP/skvoz-bin/nats-server"
          cd connectors/server
          # The real server fixture enforces the same UID and capability boundary as Compose.
          sudo --preserve-env=PATH,GEM_HOME,GEM_PATH,BUNDLE_PATH,BUNDLE_APP_CONFIG,SKVOZ_INTEGRATION,SKVOZ_TEST_RUNTIME,SKVOZ_TEST_CLIENT,SKVOZ_TEST_NATS \
            setpriv --reuid 10001 --regid 10001 --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            "$(command -v bundle)" exec rspec ../../clients/ubuntu/spec
      - name: Build and install deb
        run: |
          cargo build --release --locked -p skvoz-ubuntu-client --bin skvoz-client
          clients/ubuntu/packaging/build-deb.sh
          sudo apt-get install -y ./clients/ubuntu/dist/skvoz-client_*_amd64.deb
          /usr/bin/skvoz-client --version
          /usr/lib/skvoz-client/skvoz-network-runtime --version
          /usr/libexec/skvoz-network-helper --version
          sudo dpkg -i clients/ubuntu/dist/skvoz-client_*_amd64.deb
          sudo apt-get remove -y skvoz-client
      - name: Publish client release and retain five latest
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/ubuntu-v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          package=$(find clients/ubuntu/dist -name '*.deb' -print -quit)
          version=$(dpkg-deb -f "$package" Version)
          (cd clients/ubuntu/dist && sha256sum -c ./*.sha256)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "ubuntu-v$version"
            tag_options=(--verify-tag)
            title="SKVOZ Ubuntu $version"
          else
            tag="ubuntu-v$version-build.$GITHUB_RUN_NUMBER"
            tag_options=(--target "$GITHUB_SHA")
            title="SKVOZ Ubuntu $version (сборка $GITHUB_RUN_NUMBER)"
          fi
          printf '%s\n' 'SKVOZ: клиент Ubuntu 24.04+ amd64. Установите deb через apt; контрольная сумма SHA256 приложена.' > "$RUNNER_TEMP/release-notes.txt"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            echo "Release already exists: $tag (draft=$draft)"
          else
            gh release create "$tag" --draft "${tag_options[@]}" --title "$title" --notes-file "$RUNNER_TEMP/release-notes.txt"
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" clients/ubuntu/dist/*.deb clients/ubuntu/dist/*.sha256 --clobber
            gh release edit "$tag" --draft=false --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RUNNER_TEMP/releases.json"
          jq -r '
            add | map(select(.draft == false and (.tag_name | startswith("ubuntu-v"))))
            | sort_by(.published_at, .id) | reverse | .[5:][] | .tag_name
          ' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/obsolete-releases.txt"
          while IFS= read -r obsolete; do
            gh release delete "$obsolete" --yes
          done < "$RUNNER_TEMP/obsolete-releases.txt"
