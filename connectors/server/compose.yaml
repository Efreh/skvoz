services:
  server:
    image: ${SKVOZ_IMAGE:?Set SKVOZ_IMAGE to the reviewed GHCR image tag or digest}
    init: true
    restart: unless-stopped
    environment:
      SKVOZ_ADVERTISED_PORT: ${SKVOZ_LISTEN_PORT:-4222}
      SKVOZ_ADDRESS: ${SKVOZ_ADDRESS:?Set the public IP address or DNS name}
      SKVOZ_ACME_EMAIL: ${SKVOZ_ACME_EMAIL:?Set the certificate contact email}
      SKVOZ_ACME_TERMS_AGREED: ${SKVOZ_ACME_TERMS_AGREED:?Set true after accepting issuer terms}
      SKVOZ_ALLOW_CIDRS: ${SKVOZ_ALLOW_CIDRS:-}
    ports:
      - "${SKVOZ_LISTEN_PORT:-4222}:4222"
      - "80:8080"
    volumes:
      - state:/var/lib/skvoz
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
volumes:
  state:
