# Full server with local TLS and outgoing native leaf connections. No published ports.
services:
  server:
    image: ghcr.io/efreh/skvoz/skvoz-server:latest
    restart: unless-stopped
    command: ["serve", "--config", "/etc/skvoz-config/server.json"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./config:/etc/skvoz-config:ro
      - ./leaf:/etc/skvoz-leaf:ro
      - state:/var/lib/skvoz
      - network-state:/var/lib/skvoz-network
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.ipfrag_high_thresh: "4194304"
      net.ipv4.ipfrag_time: "15"
    stop_grace_period: 15s
volumes:
  network-state:
  state:
