[package]
name = "skvoz-daemon"
version = "1.4.0"
description = "Local IPC host for the universal SKVOZ Core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
skvoz-core = { path = "../core", features = ["nats"] }
serde_json = "=1.0.151"
getrandom = "=0.4.3"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "net", "signal"] }

[lints]
workspace = true

[[bin]]
name = "skvoz-core-daemon"
path = "src/main.rs"

[features]
default = []
real-nats = []
