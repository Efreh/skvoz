[package]
name = "skvoz-testbench"
version = "0.2.0"
description = "Experimental two-sided SKVOZ harness over real NATS"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
real-nats = []

[dependencies]
skvoz-core = { path = "../core" }
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[[test]]
name = "real_nats"
required-features = ["real-nats"]

[lints]
workspace = true
