[package]
name = "skvoz-network-ffi"
version = "0.2.0"
description = "Native ABI for the shared SKVOZ network actor"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
skvoz-network = { path = "..", features = ["linux-runtime"] }
skvoz-network-native = { path = "../native" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
