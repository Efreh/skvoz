[package]
name = "skvoz-network"
version = "0.5.0"
description = "Shared bounded network adapter for the universal SKVOZ Core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
enrollment-diagnostics = []
portable-runtime = ["dep:skvoz-network-native"]
linux-runtime = ["portable-runtime"]

[[bin]]
name = "skvoz-network-runtime"
path = "src/bin/skvoz-network-runtime.rs"
required-features = ["linux-runtime"]

[dependencies]
skvoz-core = { path = "../core", features = ["nats"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "net", "sync", "io-util"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
skvoz-network-native = { path = "native", optional = true }

[lints]
workspace = true
